    <g fill="#213d58" stroke="#43617e">
      <rect x="78" y="379" width="211" height="50" rx="12"/>
      <rect x="78" y="445" width="211" height="50" rx="12"/>
      <rect x="78" y="511" width="211" height="50" rx="12"/>
    </g>
    <g fill="#e3edf8" font-size="19">
