      <text x="102" y="477">Un medio</text>
      <text x="102" y="543">Un podcast</text>
    </g>
    <rect x="478" y="377" width="182" height="182" rx="31" fill="#f28a42"/>
    <g fill="none" stroke="#fff9f0" stroke-width="13" stroke-linecap="round">
