    <path d="M825 337H1096Q1116 337 1116 357V383H805V357Q805 337 825 337" fill="#d9e5f0"/>
    <circle cx="831" cy="361" r="5" fill="#6f89a4"/>
    <circle cx="850" cy="361" r="5" fill="#6f89a4"/>
    <circle cx="869" cy="361" r="5" fill="#6f89a4"/>
    <text x="828" y="422" fill="#213d58" font-size="23" font-weight="600">Tu lector</text>
