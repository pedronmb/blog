<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">RSS: tus fuentes, en un solo lugar</title>
  <desc id="desc">Tres sitios publican novedades en un canal RSS que un lector reúne en una lista.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102237"/>
      <stop offset="1" stop-color="#192f46"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#adc5e5" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#background)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="1130" cy="70" r="270" fill="#315475" opacity=".18"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="76" y="83" fill="#adbed2" font-size="17" letter-spacing="4">SOLIDCHAIN / WEB ABIERTA</text>
    <text x="76" y="169" fill="#f5f8fc" font-size="68" font-weight="700">Tus fuentes.</text>
    <text x="76" y="247" fill="#f5f8fc" font-size="68" font-weight="700">Tu ritmo.</text>
    <text x="78" y="298" fill="#b6c8df" font-size="24">Really Simple Syndication</text>
    <g fill="none" stroke="#6287ac" stroke-width="3">
