<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Demostrar sin revelar</title>
  <desc id="desc">Un dato privado se utiliza para producir una prueba. El verificador recibe la prueba y la afirmación pública, mientras el dato permanece con quien demuestra.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#24344a" stroke-width="1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#86a9f4"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#101b2b"/>
  <rect width="1280" height="720" fill="url(#grid)" opacity=".65"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="80" y="95" fill="#9bb6e8" font-size="18" letter-spacing="4">CRIPTOGRAFÍA · ZERO KNOWLEDGE</text>
    <text x="80" y="168" fill="#f2f6ff" font-size="52" font-weight="600">Demostrar sin revelar</text>
    <text x="80" y="210" fill="#a8b8cd" font-size="23">La afirmación se verifica. El secreto permanece privado.</text>
    <rect x="80" y="280" width="300" height="245" rx="20" fill="#17253a" stroke="#405b7e" stroke-width="2"/>
    <rect x="490" y="280" width="300" height="245" rx="20" fill="#192d4a" stroke="#86a9f4" stroke-width="2"/>
    <rect x="900" y="280" width="300" height="245" rx="20" fill="#17253a" stroke="#405b7e" stroke-width="2"/>
    <g fill="none" stroke="#a8bde0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M208 372V351a22 22 0 0 1 44 0v21"/>
      <rect x="195" y="372" width="70" height="55" rx="9"/>
      <path d="M230 393v13"/>
    </g>
    <text x="230" y="468" text-anchor="middle" fill="#eef4ff" font-size="24" font-weight="600">Dato privado</text>
    <text x="230" y="501" text-anchor="middle" fill="#a8b8cd" font-size="18">Testigo w</text>
    <text x="640" y="405" text-anchor="middle" fill="#a6c5ff" font-size="78" font-family="Georgia, serif">π</text>
    <text x="640" y="468" text-anchor="middle" fill="#eef4ff" font-size="24" font-weight="600">Prueba</text>
    <text x="640" y="501" text-anchor="middle" fill="#a8b8cd" font-size="18">Evidencia verificable</text>
    <circle cx="1050" cy="379" r="41" fill="#203c41" stroke="#81c9b4" stroke-width="2"/>
    <path d="M1032 379l12 13 26-29" fill="none" stroke="#a0e3cf" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1050" y="468" text-anchor="middle" fill="#eef4ff" font-size="24" font-weight="600">Verificador</text>
    <text x="1050" y="501" text-anchor="middle" fill="#a8b8cd" font-size="18">Recibe x y π</text>
    <path d="M396 391H472M806 391H882" fill="none" stroke="#86a9f4" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="80" y="606" fill="#c6d5ea" font-size="22">R(x, w) = 1</text>
    <text x="80" y="642" fill="#8f9fb8" font-size="18">Una relación verdadera entre una afirmación pública y un testigo privado.</text>
    <text x="1200" y="642" text-anchor="end" fill="#8f9fb8" font-size="20">Solidchain.</text>
  </g>
</svg>
